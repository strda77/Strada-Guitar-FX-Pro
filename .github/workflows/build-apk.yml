
name: Build Strada Guitar FX Pro APK
on:
  push:
    branches: [ main, v4-development ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools


      - name: Extract new source ZIP
        run: |
          test -f Strada-Guitar-FX-Pro-Source.zip
          mkdir -p source
          unzip -q Strada-Guitar-FX-Pro-Source.zip -d source
          test -f source/Strada-Guitar-FX-Pro/app/build.gradle

      
      - name: Apply V2 MainActivity overlay
        run: |
          cp v2-overlay/app/src/main/java/com/strada/guitarfXpro/MainActivity.java source/Strada-Guitar-FX-Pro/app/src/main/java/com/strada/guitarfXpro/MainActivity.java

      - name: Inspect app source for V2 integration
        working-directory: source/Strada-Guitar-FX-Pro
        run: |
          echo '--- JAVA SOURCE FILES ---'
          find app/src/main -type f | sort
          echo '--- MAIN ACTIVITY ---'
          MAIN=$(find app/src/main -name MainActivity.java | head -n 1)
          if [ -n "$MAIN" ]; then sed -n '1,280p' "$MAIN"; else echo 'MainActivity.java not found'; fi
          echo '--- MANIFEST ---'
          sed -n '1,220p' app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: source/Strada-Guitar-FX-Pro
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Strada-Guitar-FX-Pro-APK
          path: source/Strada-Guitar-FX-Pro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
