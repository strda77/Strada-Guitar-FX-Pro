
name: Strada Desktop Build

on:
  push:
    branches:
      - desktop-audio
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile desktop application
        shell: bash
        run: |
          mkdir -p build/classes
          find desktop/src/main/java -name "*.java" > sources.txt
          javac -encoding UTF-8 -d build/classes @sources.txt

      - name: Package runnable JAR
        shell: bash
        run: |
          jar --create --file build/StradaDesktop.jar \
            --main-class com.strada.desktop.StradaDesktop \
            -C build/classes .

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: Strada-Desktop-${{ matrix.os }}
          path: build/StradaDesktop.jar
          if-no-files-found: error
